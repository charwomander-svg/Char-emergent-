services:
  - type: web
    name: ghost-maze-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: MONGO_URL
        sync: false          # set in Render dashboard
      - key: DB_NAME
        value: ghost_maze
      - key: STRIPE_API_KEY
        sync: false          # set in Render dashboard (sk_live_...)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false          # set after creating webhook in Stripe dashboard
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false          # set to your Render service URL once deployed
      - key: CORS_ORIGINS
        value: "*"

services:
  - type: web
    name: ghost-maze-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: MONGO_URL
        sync: false          # set in Render dashboard
      - key: DB_NAME
        value: ghost_maze
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false          # set to your Render service URL once deployed
      - key: CORS_ORIGINS
        value: "*"

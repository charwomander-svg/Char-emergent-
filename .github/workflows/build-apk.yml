name: Build Android Release Artifacts (AAB Only)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode for Play Console (must increase each upload)"
        required: true
        default: 300
        type: number
      version_name:
        description: "Android versionName shown to users"
        required: false
        default: "1.0.0"
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed Android AAB
        working-directory: frontend/android
        env:
          EXPO_PUBLIC_BACKEND_URL: https://ghost-maze-backend.onrender.com
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          ./gradlew bundleRelease --no-daemon

      - name: Verify artifact signing certificate
        working-directory: frontend/android
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          ACTUAL_SHA1=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | sed -n 's/.*SHA1: //p')
          echo "Artifact SHA1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "AE:BE:7E:D2:0D:1C:58:33:ED:E3:6B:87:DC:16:62:8C:E0:69:AE:C9"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-maze-production-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

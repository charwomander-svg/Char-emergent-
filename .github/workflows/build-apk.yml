name: Build Android AAB (Production)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up EAS CLI
        run: npm install -g eas-cli@20.5.1

      - name: Build Android AAB (local)
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          EXPO_PUBLIC_BACKEND_URL: https://ghost-maze-backend.onrender.com
        run: eas build --platform android --profile production --local --non-interactive --output ../ghost-maze.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-maze-production-aab
          path: ghost-maze.aab
          retention-days: 30

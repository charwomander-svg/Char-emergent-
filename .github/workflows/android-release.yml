name: Android Verification

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/build-apk.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Check maze playability
        run: npm run maze:check

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify upload key fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E "SHA1:|SHA256:"

      - name: Build release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify release AAB certificate
        working-directory: frontend/android
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          ACTUAL_SHA1=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | sed -n 's/.*SHA1: //p')
          echo "Artifact SHA1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "AE:BE:7E:D2:0D:1C:58:33:ED:E3:6B:87:DC:16:62:8C:E0:69:AE:C9"

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
